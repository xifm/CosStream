<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CosApp 终极流媒体</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.3.5/hls.min.js" defer></script>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="sticky-header">
        <div class="header-top">
            <h1 class="logo" onclick="location.reload()">🚀 CosStream</h1>
            <div class="search-wrapper">
                <input type="text" id="search-input" placeholder="输入角色名、简称或番号..." onkeydown="if(event.key==='Enter') executeSearch()">
                <button onclick="executeSearch()">搜索</button>
            </div>
        </div>
        <div class="nav-bar" id="nav-bar">
            <button class="active" onclick="switchCategory('order=mr', this)">🔥 最新</button>
            <button onclick="switchCategory('order=mv', this)">👑 热门</button>
            <button onclick="switchCategory('tags=%E7%8B%AC%E5%AE%B6', this)">💎 独家</button>
            <button onclick="switchCategory('ct=8', this)">🎬 FC2</button>
            <button onclick="switchCategory('ct=2', this)">🔞 AV</button>
            <button onclick="switchCategory('ct=1', this)">🌸 同人</button>
            <button onclick="switchCategory('custom_search=%E7%B1%B3%E5%93%88%E6%B8%B8', this)">💫 米哈游</button>
        </div>
    </div>

    <div class="layout-bar">
        <span>布局</span>
        <button onclick="setColumns(1)" id="btn-col-1">1</button>
        <button onclick="setColumns(2)" id="btn-col-2">2</button>
        <button onclick="setColumns(3)" id="btn-col-3">3</button>
        <button onclick="setColumns(4)" id="btn-col-4">4</button>
        <button onclick="setColumns('auto')" id="btn-col-auto" class="active">自适应</button>
    </div>

    <div id="status-msg"></div>
    <div id="result" class="grid-container col-auto"></div>
    <div id="bottom-loading"><div class="spinner"></div>正在加载下一页...</div>

    <div class="pagination" id="pagination-bar">
        <button onclick="changePage(-1)">◀</button>
        <div class="page-info" id="current-page-display" onclick="promptJump()">加载中</div>
        <button onclick="changePage(1)">▶</button>
    </div>

    <div class="player-modal" id="player-modal">
        <div class="player-overlay" onclick="closePlayer()"></div>
        <div class="player-content">
            <div class="player-header">
                <h3 class="player-title" id="player-title">加载中...</h3>
                <button class="close-btn" onclick="closePlayer()">✕</button>
            </div>
            
            <div class="video-container" id="video-container" oncontextmenu="event.preventDefault(); return false;">
                <div id="video-poster"></div>
                <video id="main-video" playsinline controls controlsList="nofullscreen"></video>
                <div id="brightness-mask"></div>
                <div class="action-toast" id="action-toast">⏩ 2.0x 快进</div>
                
                <div id="preview-toast">
                    <video id="preview-video" muted playsinline></video>
                    <div id="preview-time-text">00:00 / 00:00</div>
                </div>
            </div>
            
            <div class="player-details-area" id="player-details-area">
                <h2 class="full-title-display" id="full-video-title">加载中...</h2>
                <div class="route-buttons" id="route-buttons-area"></div>
                <div class="detail-grid" id="modal-details-grid"></div>
            </div>
        </div>
    </div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
